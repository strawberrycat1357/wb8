<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop Shadow Practice</title>
    <style>
        body {
            background-color: #f0f0f0;
            padding: 20px;
        }
        h2 {
            color: black;
            margin: 0 ;
        }
        img {
            width: 120px;
            border: 10px solid #000;
            margin-right: 10px;
        }
        .a { filter: drop-shadow(15px 25px 10px #000); }
        .b { filter: drop-shadow(-5px -30px 30px #000); }
        .c { filter: drop-shadow(5px 5px 2px #000); }
    </style>
</head>
<body>
    <h2 class="a">陰影練習</h2>
    <h2 class="b">陰影練習</h2>
    <h2 class="c">陰影練習</h2>
    <br/>
    <img class="a" src="123.jpg" >
    <img class="b" src="123.jpg" >
    <img class="c" src="123.jpg" >
</body>
</html>
