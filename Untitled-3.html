<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>圓餅圖示範</title>
  <style>
    #grad {
      width: 200px;
      height: 200px;
      background-image: conic-gradient(
        red 0deg,
        red 90deg,
        yellow 90deg,
        yellow 180deg,
        green 180deg,
        green 270deg,
        blue 270deg
      );
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <div id="grad"></div>

</body>
</html>
